<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TikTok Live Chat Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-card {
      display: flex;
      align-items: center;
      background: rgba(18, 18, 18, 0.85);
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
      border: 2px solid #fe2c55;
    }

    .content {
      display: flex;
      flex-direction: column;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .username {
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
    }

    .badge {
      background-color: #fe2c55;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .message {
      font-size: 13px;
      color: #e1e1e1;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const socket = io();

    socket.on('new-webhook', (data) => {
      console.log('Evento recibido:', data);
      
      const container = document.getElementById('container');
      
      // Extraer datos o usar valores por defecto de la prueba de TikFinity
      const avatarUrl = data.avatar || data.profile_picture || 'https://www.tiktok.com/favicon.ico';
      const username = data.nickname || data.username || data.user || 'Usuario';
      
      const card = document.createElement('div');
      card.className = 'chat-card';
      card.innerHTML = `
        <img class="avatar" src="${avatarUrl}" alt="avatar" onerror="this.src='https://www.tiktok.com/favicon.ico'">
        <div class="content">
          <div class="header-info">
            <span class="username">${username}</span>
            <span class="badge">📌 Anclado</span>
          </div>
          <div class="message">Vouch</div>
        </div>
      `;

      container.appendChild(card);

      // Ocultar la tarjeta automáticamente después de 10 segundos
      setTimeout(() => {
        card.style.transition = 'opacity 0.5s ease';
        card.style.opacity = '0';
        setTimeout(() => card.remove(), 500);
      }, 10000);
    });
  </script>
</body>
</html>
