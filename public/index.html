<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comentario Anclado TikTok</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #pinned-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 5px solid #fe2c55;
      border-radius: 12px;
      padding: 12px 18px;
      max-width: 450px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #pinned-container.show {
      opacity: 1;
      transform: translateY(0);
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #25f4ee;
    }
    .content {
      display: flex;
      flex-direction: column;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      color: #fe2c55;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .username {
      font-size: 0.95rem;
      font-weight: 700;
      color: #25f4ee;
    }
    .comment {
      font-size: 0.9rem;
      color: #e0e0e0;
      margin-top: 2px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="pinned-container">
    <img id="avatar" class="avatar" src="https://via.placeholder.com/150" alt="Avatar">
    <div class="content">
      <span class="badge">📌 Comentario Anclado</span>
      <span id="username" class="username">@Usuario</span>
      <span id="comment" class="comment">¡Escribe tu comentario en el chat!</span>
    </div>
  </div>

  <script>
    const socket = io();
    const container = document.getElementById('pinned-container');
    const avatarImg = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const commentEl = document.getElementById('comment');

    socket.on('pinned_comment', (data) => {
      usernameEl.textContent = '@' + data.nickname;
      commentEl.textContent = data.comment;
      if (data.avatar) avatarImg.src = data.avatar;

      container.classList.add('show');
    });
  </script>
</body>
</html>
