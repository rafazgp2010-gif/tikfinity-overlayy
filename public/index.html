<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Chat Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;600;700&display=swap');

    body {
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: transparent; /* Transparente para OBS */
      color: #ffffff;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.55); /* Fondo oscuro transparente */
      backdrop-filter: blur(4px);
      padding: 8px 12px;
      border-radius: 12px;
      width: fit-content;
      max-width: 85%;
      animation: tiktokFadeIn 0.25s ease-out;
    }

    @keyframes tiktokFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .content-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .username {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.2;
    }

    .badge {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
    }

    .message {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      line-height: 1.2;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="chat-container"></div>

  <script>
    const socket = io();
    const container = document.getElementById('chat-container');

    socket.on('tikfinity-event', (data) => {
      const row = document.createElement('div');
      row.className = 'chat-row';

      const user = data.nickname || data.username || 'Usuario';
      const avatarUrl = data.profilePictureUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_normal.png';

      // Estructura idéntica a la imagen de TikTok Live
      row.innerHTML = `
        <img class="avatar" src="${avatarUrl}" onerror="this.src='https://abs.twimg.com/sticky/default_profile_images/default_profile_normal.png'" />
        <div class="content-box">
          <div class="user-header">
            <span class="username">${user}</span>
            <span class="badge">📌 Anclado</span>
          </div>
          <div class="message">Vouch</div>
        </div>
      `;

      container.appendChild(row);

      // Limitar a máximo 6 mensajes en pantalla
      if (container.children.length > 6) {
        container.removeChild(container.firstChild);
      }
    });
  </script>
</body>
</html>
